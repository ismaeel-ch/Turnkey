name: Deploy hook (fallback, off by default)

# Example fallback, switched off. Vercel's Git integration deploys main on every merge (vercel.json). Turn this on only
# if merges to main stop starting Vercel deployments (see docs/process/deploy.md).
#
# To turn it on: create a Vercel deploy hook for the production branch main, store its URL as the repository secret
# VERCEL_DEPLOY_HOOK_URL, then set the repository variable VERCEL_DEPLOY_HOOK_ENABLED to true. Turn it off again
# by deleting that variable or setting it to any other value. Turn it on for one deployment path only: running it
# next to a working Git integration deploys every merge twice and uses two of the 100 daily deployments.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: call the Vercel deploy hook
    if: vars.VERCEL_DEPLOY_HOOK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the hook without printing its URL
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "The VERCEL_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Deploy hook called for commit $GITHUB_SHA."
