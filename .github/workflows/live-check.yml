name: Live site check

# Runs the production smoke test (tests/e2e/smoke.cjs) against the live site, by hand only. Use it to check the live
# site between releases, for example after changing an environment variable in Vercel. It never runs on its own, so
# it adds nothing to the CI on pull requests. It makes at most one small model call (the health probe), and only when
# a model is configured. Each run also leaves one short link named release-check in the short-link store.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Address to check
        required: true
        default: https://turnkey-bay.vercel.app
        type: string
      version:
        description: Version the site should report, for example v0.3.2 (leave empty to skip this check)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke test the live site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Health, page, sample build, short link and one model call
        env:
          TK_URL: ${{ inputs.url }}
          EXPECT_VERSION: ${{ inputs.version }}
        run: node tests/e2e/smoke.cjs
