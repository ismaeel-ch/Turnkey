name: Live site check

# Runs the production smoke test (tests/e2e/smoke.cjs) against the live site, by hand only. Use it to check the live
# site between releases, for example after changing an environment variable in Vercel. It never runs on its own, so
# it adds nothing to the CI on pull requests. When a model is configured it runs one Live build of the clinic sample
# (about ten model calls) and one health probe; turn the build off with the live_build input. Each run also leaves one short link named release-check in the short-link store.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Address to check
        required: true
        default: https://turnkey-bay.vercel.app
        type: string
      version:
        description: Version the site should report, for example v0.3.2 (leave empty to skip this check)
        required: false
        type: string
      live_build:
        description: Run one Live build of the clinic sample (about ten model calls)
        required: false
        default: true
        type: boolean
      guided:
        description: After the Live build, walk the rest of the guided flow in that app (first use, demo data removal, release 1.0, one change, the next release). A few more model calls
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke test the live site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: scripts/install-test-browser.sh
      - name: Health, page, sample build, short link and one model call
        env:
          TK_URL: ${{ inputs.url }}
          EXPECT_VERSION: ${{ inputs.version }}
          SMOKE_LIVE_BUILD: ${{ inputs.live_build && '1' || '0' }}
          SMOKE_GUIDED: ${{ inputs.guided && '1' || '0' }}
        run: node tests/e2e/smoke.cjs
