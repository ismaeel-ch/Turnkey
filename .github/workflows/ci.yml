name: CI

# Every pull request and every push to main: secrets scan, lint, typecheck, unit tests, a production build,
# the 286 browser checks (one job per flow), and the legacy guard (src/legacy changes need WP-16 or [legacy] in the title).
# The job named "ci" is the single result branch protection requires.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  legacy-guard:
    name: legacy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail a pull request that changes src/legacy without WP-16 or [legacy] in its title
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/legacy-guard.mjs

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets scan
        run: npm run check:secrets
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: e2e (${{ matrix.flow }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flow: [demo, live, misc, views, quests, new, custom, round6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Browser checks
        id: flow
        run: |
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run test:e2e -- ${{ matrix.flow }}
      - name: Summary of this browser flow
        if: always()
        env:
          FLOW: ${{ matrix.flow }}
          OUTCOME: ${{ steps.flow.outcome }}
        run: |
          {
            echo "### Browser flow: $FLOW"
            echo ""
            echo "Result: $OUTCOME. Failure screenshots, if any, are in the artifact shots-$FLOW."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep screenshots when a flow fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shots-${{ matrix.flow }}
          path: tests/e2e/shots
          retention-days: 3
          if-no-files-found: ignore

  ci:
    name: ci
    if: always()
    needs: [legacy-guard, check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          GUARD: ${{ needs.legacy-guard.result }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "legacy-guard: $GUARD, check: $CHECK, e2e: $E2E"
          test "$GUARD" = "success"
          test "$CHECK" = "success"
          test "$E2E" = "success"
