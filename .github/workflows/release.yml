name: Release and deploy

# Production deploys happen here and nowhere else. Vercel's own Git integration is switched off in vercel.json, so
# merges and pushes never deploy by themselves.
#
# Three ways to start a release:
# 1. Merge a pull request that raises "version" in package.json (and adds the CHANGELOG entry). This workflow then
#    checks that commit, deploys it, and creates the tag v<version> and the GitHub release with generated notes.
#    This is the usual way, and the one agents use: it needs no permission beyond merging a pull request.
#    A change to package.json that keeps the version (a new dependency, say) starts a run that stops in seconds.
# 2. Publish a GitHub release on the website. Its tag must point at a commit on main. Pre-releases deploy too.
# 3. Run this workflow by hand from the Actions tab with an existing tag, to redeploy it or roll back to it.
#
# Each path runs `npm run check` on the exact commit, builds it with the Vercel CLI, deploys it to production and
# checks /api/health. The browser flows are not run again: CI ran them on the pull request.
#
# Needs three repository secrets (Settings, Secrets and variables, Actions): VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID. docs/process/deploy.md says where to find them. The model key stays in Vercel's environment
# variables; `vercel pull` brings them into the build and they are never printed.

on:
  push:
    branches: [main]
    # A change to this file also counts, so that fixing the workflow retries a version whose release failed.
    paths: [package.json, .github/workflows/release.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to deploy, for example v0.2.0
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@65.14.0

jobs:
  prepare:
    name: decide what to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
      create: ${{ steps.decide.outputs.create }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        name: Work out the tag and the commit
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          create=false
          case "$EVENT" in
            push)
              version="$(node -p "require('./package.json').version")"
              tag="v$version"
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                echo "$tag already exists, so this change to package.json is not a release. Nothing to do."
                echo "go=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sha="$GITHUB_SHA"
              create=true
              ;;
            release)  tag="$RELEASE_TAG" ;;
            *)        tag="$INPUT_TAG" ;;
          esac
          if [ "$EVENT" != push ]; then
            if ! sha="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
              echo "The tag $tag does not exist."
              exit 1
            fi
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "$tag points at $sha, which is not on main. Release a commit that is merged to main."
            exit 1
          fi
          echo "Releasing $tag from $sha."
          {
            echo "go=true"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "create=$create"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: verify the release
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks (secrets scan, lint, typecheck, unit tests)
        run: npm run check

  deploy:
    name: deploy to production
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.address.outputs.url }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: The Vercel secrets must be set
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing. See docs/process/deploy.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Pull the production settings and environment variables from Vercel
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with the Vercel CLI
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the build to production
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TAG to $url"
      - name: Find the production address of the deployment
        id: address
        # The deployment's own URL can sit behind Vercel's deployment protection, so the health check uses the
        # production address Vercel assigned to it: the repository variable PRODUCTION_URL if set, otherwise the
        # deployment's shortest alias as reported by the Vercel API.
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          OVERRIDE: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            echo "url=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using PRODUCTION_URL: $OVERRIDE"
            exit 0
          fi
          host="${DEPLOYMENT_URL#https://}"
          query=""
          case "$VERCEL_ORG_ID" in team_*) query="?teamId=$VERCEL_ORG_ID" ;; esac
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host$query" > deployment.json
          alias="$(node -e '
            const d = JSON.parse(require("fs").readFileSync("deployment.json", "utf8"));
            const list = (d.alias || []).slice().sort((a, b) => a.length - b.length);
            process.stdout.write(list[0] || "");
          ')"
          rm -f deployment.json
          if [ -z "$alias" ]; then
            echo "Vercel reported no production alias for $DEPLOYMENT_URL."
            exit 1
          fi
          echo "url=https://$alias" >> "$GITHUB_OUTPUT"
          echo "Production address: https://$alias"
      - name: Smoke test the health route on the production address
        env:
          PRODUCTION_URL: ${{ steps.address.outputs.url }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/health"; then
              echo
              echo "Health route answered."
              exit 0
            fi
            sleep 10
          done
          echo "The health route at $PRODUCTION_URL did not answer after three attempts."
          exit 1
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PRODUCTION_URL: ${{ steps.address.outputs.url }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Production deploy of $TAG"
            echo ""
            echo "Result: $OUTCOME. Deployment: ${URL:-not created}. Live at ${PRODUCTION_URL:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: create the tag and the GitHub release
    needs: [prepare, deploy]
    if: needs.prepare.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes, unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes --latest
          fi
