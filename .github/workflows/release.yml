name: Release and deploy

# Production deploys happen here and nowhere else. Publishing a GitHub release (not a draft, not a pre-release) whose
# tag points at a commit on main runs the checks on that exact commit, builds it with the Vercel CLI and deploys it
# to production. Vercel's own Git integration is switched off in vercel.json, so merges and pushes never deploy.
#
# Start it by publishing a release on the GitHub website (Releases, Draft a new release, pick or create the tag,
# Generate release notes, Publish) or with `gh release create v0.2.0 --target main --generate-notes`. A release made
# by another workflow with GITHUB_TOKEN does not start it; GitHub does not chain workflows that way.
#
# To redeploy or roll back, run this workflow by hand from the Actions tab and give it an existing tag.
# The browser flows are not run again: CI ran them on the pull request.
#
# Needs three repository secrets (Settings, Secrets and variables, Actions): VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID. docs/process/deploy.md says where to find them. The model key stays in Vercel's environment
# variables; `vercel pull` brings them into the build and they are never printed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy, for example v0.2.0
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  VERCEL_CLI: vercel@65.14.0
  # The public production address. Set the repository variable PRODUCTION_URL if it changes.
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://ssi-ai-hackathon.vercel.app' }}

jobs:
  verify:
    name: verify the release
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: The tag must point at a commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          SHA="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$TAG points at $SHA, which is on main."
          else
            echo "$TAG points at $SHA, which is not on main. Release a commit that is merged to main."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks (secrets scan, lint, typecheck, unit tests)
        run: npm run check

  deploy:
    name: deploy to production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: The Vercel secrets must be set
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing. See docs/process/deploy.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Pull the production settings and environment variables from Vercel
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with the Vercel CLI
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the build to production
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TAG to $url"
      - name: Smoke test the health route on the production address
        # The production address, not the deployment's own URL: Vercel's deployment protection can put a login in
        # front of the latter.
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/health"; then
              echo
              echo "Health route answered."
              exit 0
            fi
            sleep 10
          done
          echo "The health route did not answer after three attempts."
          exit 1
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Production deploy of $TAG"
            echo ""
            echo "Result: $OUTCOME. Deployment: ${URL:-not created}. Live at $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
