name: Release

# A tag such as v0.2.0 starts this workflow. It checks that the tag points at a commit on main, runs the checks and
# the production build, and then publishes a GitHub release with notes generated from the merged pull requests.
# If the release already exists it is left alone. The browser flows are not run again: main's CI ran them on this commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag must point at a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG points at $GITHUB_SHA, which is on main."
          else
            echo "$TAG points at $GITHUB_SHA, which is not on main. Tag a commit that is merged to main."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks (secrets scan, lint, typecheck, unit tests)
        run: npm run check
      - name: Production build
        run: npm run build

  release:
    name: publish the release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release with generated notes, unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
