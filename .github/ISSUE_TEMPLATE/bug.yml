name: Bug
description: Something that does not work as the plan or the app's own text says
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the workspace
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The live Vercel URL
        - A local build (npm run dev)
        - CI (a failing check)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The error text or a screenshot. Remove any key or personal data first.
